name: Build iOS IPA

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile iOS IPA (Capacitor)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr9 SSATVLive.ipa Payload
          ls -lh SSATVLive.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSATVLive-iOS-IPA
          path: build/SSATVLive.ipa
          retention-days: 30
