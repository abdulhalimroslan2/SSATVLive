user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression for Manifests & Metadata
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        application/dash+xml
        application/vnd.apple.mpegurl;

    # DNS Resolvers (Google & Cloudflare)
    resolver 8.8.8.8 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # =========================================================================
    # RAM CACHE STORAGE ZONE (tmpfs in Memory)
    # 100MB keys_zone = ~800,000 active segment keys in memory
    # 2GB max_size = holds thousands of live video fragments
    # inactive=10m = automatically purge segments older than 10 mins
    # =========================================================================
    proxy_cache_path /var/cache/nginx/stream 
        levels=1:2 
        keys_zone=STREAM_CACHE:100m 
        max_size=2g 
        inactive=10m 
        use_temp_path=off;

    # =========================================================================
    # BACKEND ROUTING MAP
    # Maps URL prefix to real upstream host
    # =========================================================================
    map $stream_prefix $backend_host {
        astro-linear    linearjitp-playback.astro.com.my;
        astro-vod       vodejitp-asset-playback-b.astro.com.my;
        iris-synamedia  vod-dai-ott-ap.ssai.iris.synamedia.com;
        ngtv-vod        ngtv-vod.gcdn.co;
        viu-vod         dms-api.viu.com;
        viu-key         prod-in.viu.com;
        okcdn           vd466.okcdn.ru;
        rtm-stream      d25tgymtnqzu8s.cloudfront.net;
        cf-d2xz         d2xz2v5wuvgur6.cloudfront.net;
        cf-d2tj         d2tjypxxy769fn.cloudfront.net;
        cf-d84q         d84q7nw4qf3j3.cloudfront.net;
        cf-d3b0         d3b0v7fggu5zwm.cloudfront.net;
        cf-df14         df14pcdp16s98.cloudfront.net;
        cf-d2to         d2tolhxlph2dpt.cloudfront.net;
        mana2           slive.mana2.my;
        ptv2026         ptv2026.com;
        load-ptv        load.ptv2026.com;
        perfecttv       get.perfecttv.net;
        gcdn-s          ngtv-live-cbj.gcdn.co;
        gcdn            ngtv-live-cbj.gcdn.co;
        gcdn-live       ngtv-live.gcdn.co;
        default         "";
    }

    # Protocol map (HTTP for legacy gcdn, HTTPS for all others)
    map $stream_prefix $backend_proto {
        gcdn    http;
        default https;
    }

    # Custom Origin Header Map
    map $stream_prefix $custom_origin {
        viu-vod     "https://www.viu.com";
        viu-key     "https://www.viu.com";
        okcdn       "https://ok.ru";
        rtm-stream  "https://rtmklik.rtm.gov.my";
        default     "";
    }

    # Custom Referer Header Map
    map $stream_prefix $custom_referer {
        viu-vod     "https://www.viu.com/";
        viu-key     "https://www.viu.com/";
        okcdn       "https://ok.ru/";
        rtm-stream  "https://rtmklik.rtm.gov.my/";
        default     "";
    }

    # Custom Upstream User-Agent Map (Desktop Chrome for OKCDN & Viu, Android MiTV for others)
    map $stream_prefix $custom_user_agent {
        okcdn       "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        viu-vod     "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        viu-key     "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        default     "Mozilla/5.0 (Linux; Android 10; MiTV-AXSO0 Build/QTZCS200912.005) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36";
    }

    # Log format with cache status and timing
    log_format stream_combined '$remote_addr - [$time_local] "$request" '
                               '$status $body_bytes_sent '
                               'cache:$upstream_cache_status '
                               'upstream:$upstream_addr '
                               'req_time:$request_time '
                               'up_time:$upstream_response_time '
                               '"$http_user_agent"';

    access_log /var/log/nginx/access.log stream_combined;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # MAIN EDGE PROXY SERVER
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        
        # Optional SSL if certificates are mounted
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        server_name _;

        # Root directory for static web app (if hosting frontend on VPS)
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # HEALTH CHECK & DIAGNOSTICS
        # ---------------------------------------------------------------------
        location = /health {
            add_header Content-Type application/json always;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{"status":"ok","proxy":"Nginx Edge Cache Proxy","version":"2.0","cache_mode":"RAM tmpfs","request_coalescing":true,"timestamp":"$time_iso8601"}';
        }

        # ---------------------------------------------------------------------
        # DYNAMIC OKCDN SUBDOMAINS (vd*.okcdn.ru)
        # Supports all dynamic Russian OK CDN video streaming servers with desktop UA
        # ---------------------------------------------------------------------
        location ~* ^/okcdn/(?<okcdn_subdomain>vd\d+\.okcdn\.ru)/(?<file_path>.*)$ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
                add_header Access-Control-Allow-Headers '*' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass https://$okcdn_subdomain/$file_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_ssl_server_name on;
            proxy_ssl_name $okcdn_subdomain;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse on;

            proxy_set_header Host $okcdn_subdomain;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Accept "*/*";
            proxy_set_header Accept-Language "en-US,en;q=0.9";

            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Via "";
            proxy_set_header Forwarded "";

            proxy_set_header Origin "https://ok.ru";
            proxy_set_header Referer "https://ok.ru/";

            proxy_cache STREAM_CACHE;
            proxy_cache_key $okcdn_subdomain/$file_path;
            proxy_cache_valid 200 206 3m;
            proxy_cache_valid 301 302 1m;
            proxy_cache_valid any 0s;

            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_lock_age 5s;

            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;

            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;

            proxy_force_ranges on;
            proxy_buffering on;

            proxy_connect_timeout 4s;
            proxy_send_timeout 15s;
            proxy_read_timeout 20s;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Date, X-Cache-Status' always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=120" always;
        }

        # ---------------------------------------------------------------------
        # 1. MEDIA SEGMENTS (.m4s, .ts, .mp4, .m4v, .m4a, .m4f)
        # REQUEST COALESCING: Only 1 request goes upstream for all 100 users!
        # Cached in RAM for 3 minutes.
        # ---------------------------------------------------------------------
        location ~* ^/(?<stream_prefix>astro-linear|astro-vod|iris-synamedia|ngtv-vod|viu-vod|viu-key|okcdn|rtm-stream|cf-[^/]+|mana2|ptv2026|load-ptv|perfecttv|gcdn-s|gcdn-live|gcdn)/(?<file_path>.*\.(m4s|ts|mp4|m4v|m4a|m4f))(?<query_part>\?.*)?$ {
            # CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
                add_header Access-Control-Allow-Headers '*' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            # Upstream Validation
            if ($backend_host = "") {
                return 404 '{"error":"Unknown stream upstream"}';
            }

            # Target Proxy Pass
            proxy_pass $backend_proto://$backend_host/$file_path$is_args$args;

            # HTTP 1.1 Persistent Connection to Upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Upstream SSL SNI
            proxy_ssl_server_name on;
            proxy_ssl_name $backend_host;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse on;

            # Anti-Tracking: Disguise with appropriate User-Agent
            proxy_set_header Host $backend_host;
            proxy_set_header User-Agent $custom_user_agent;
            proxy_set_header Accept "*/*";
            proxy_set_header Accept-Language "en-US,en;q=0.9";
            
            # Strip all downstream real client IPs and tracking headers
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Via "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Original-Forwarded-For "";

            # Custom Origin / Referer for services that validate headers
            proxy_set_header Origin $custom_origin;
            proxy_set_header Referer $custom_referer;

            # -----------------------------------------------------------------
            # CACHE & REQUEST COALESCING CONFIGURATION
            # -----------------------------------------------------------------
            proxy_cache STREAM_CACHE;
            
            # Key ignores query parameters for media chunks (identical video data)
            proxy_cache_key $backend_host/$file_path;
            
            # Cache valid responses for 3 minutes in RAM
            proxy_cache_valid 200 206 3m;
            proxy_cache_valid 301 302 1m;
            proxy_cache_valid 404 10s;
            proxy_cache_valid any 0s;

            # CRITICAL: Request Coalescing (Collapses 100 user requests into 1)
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_lock_age 5s;

            # Resilience: Serve cached data even if upstream momentarily stutters
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;

            # Ignore upstream no-cache / private headers
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;

            # Support Byte-Range seeks in DASH/HLS
            proxy_force_ranges on;
            proxy_buffering on;

            # Timeouts
            proxy_connect_timeout 4s;
            proxy_send_timeout 15s;
            proxy_read_timeout 20s;

            # Downstream CORS & Cache Status Headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Date, X-Cache-Status' always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=120" always;
        }

        # ---------------------------------------------------------------------
        # 2. MANIFEST PLAYLISTS (.mpd, .m3u8)
        # Live synchronization cache: 2 seconds TTL so viewers stay in sync.
        # Request Coalescing: Upstream receives at most 1 manifest request every 2s.
        # ---------------------------------------------------------------------
        location ~* ^/(?<stream_prefix>astro-linear|astro-vod|iris-synamedia|ngtv-vod|viu-vod|viu-key|okcdn|rtm-stream|cf-[^/]+|mana2|ptv2026|load-ptv|perfecttv|gcdn-s|gcdn-live|gcdn)/(?<file_path>.*\.(mpd|m3u8))(?<query_part>\?.*)?$ {
            # CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
                add_header Access-Control-Allow-Headers '*' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            if ($backend_host = "") {
                return 404 '{"error":"Unknown stream upstream"}';
            }

            proxy_pass $backend_proto://$backend_host/$file_path$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_ssl_server_name on;
            proxy_ssl_name $backend_host;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse on;

            proxy_set_header Host $backend_host;
            proxy_set_header User-Agent $custom_user_agent;
            proxy_set_header Accept "*/*";
            proxy_set_header Accept-Language "en-US,en;q=0.9";
            
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Via "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Original-Forwarded-For "";

            proxy_set_header Origin $custom_origin;
            proxy_set_header Referer $custom_referer;

            # Cache: 2s TTL with request lock for manifests
            proxy_cache STREAM_CACHE;
            proxy_cache_key $backend_host/$file_path$is_args$args;
            proxy_cache_valid 200 206 2s;
            proxy_cache_valid any 0s;

            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_lock_age 2s;

            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;

            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;

            proxy_connect_timeout 4s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Date, X-Cache-Status' always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # ---------------------------------------------------------------------
        # 3. KEYS, LICENSES, API & GENERAL PROXY PASS-THROUGH
        # ClearKey / Widevine License Requests (Pass-through with device spoofing)
        # ---------------------------------------------------------------------
        location ~* ^/(?<stream_prefix>astro-linear|astro-vod|iris-synamedia|ngtv-vod|viu-vod|viu-key|okcdn|rtm-stream|cf-[^/]+|mana2|ptv2026|load-ptv|perfecttv|gcdn-s|gcdn-live|gcdn)/(?<file_path>.*)$ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
                add_header Access-Control-Allow-Headers '*' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            if ($backend_host = "") {
                return 404 '{"error":"Unknown stream upstream"}';
            }

            proxy_pass $backend_proto://$backend_host/$file_path$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_ssl_server_name on;
            proxy_ssl_name $backend_host;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host $backend_host;
            proxy_set_header User-Agent $custom_user_agent;
            
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Via "";
            proxy_set_header Forwarded "";

            proxy_set_header Origin $custom_origin;
            proxy_set_header Referer $custom_referer;

            proxy_connect_timeout 4s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header X-Cache-Status "BYPASS" always;
        }

        # ---------------------------------------------------------------------
        # 4. FRONTEND WEB APPLICATION (SPA ROUTING)
        # Serves dist/ when hosting React application directly on the VPS
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
