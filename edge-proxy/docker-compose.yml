services:
  edge-proxy:
    image: nginx:alpine
    container_name: unifi_edge_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    tmpfs:
      # Mount 2GB RAM tmpfs directly for sub-millisecond video chunk caching (Zero SSD wear)
      - /var/cache/nginx/stream:size=2048M,mode=1777
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
